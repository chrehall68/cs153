name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Format java files with google-java-format and
        run: |
          cd cs153 
          wget https://github.com/google/google-java-format/releases/download/v1.36.1/google-java-format-1.36.1-all-deps.jar
          java -jar google-java-format-1.36.1-all-deps.jar --replace --skip-javadoc-formatting **/*.java
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Format java files"
