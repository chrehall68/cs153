name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Format java files with google-java-format
        run: |
          wget https://github.com/google/google-java-format/releases/download/v1.36.1/google-java-format-1.36.1-all-deps.jar
          find . -name "*.java" -type f -print0 | xargs -0 java -jar google-java-format-1.36.1-all-deps.jar --replace --skip-javadoc-formatting
          rm google-java-format-1.36.1-all-deps.jar
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Format java files"
          repository: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
